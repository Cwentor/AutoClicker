name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AutoClicker ${{ github.ref_name }}'
          releaseBody: '下载 `AutoClicker_*_x64-setup.exe` 安装，或下载免安装的 `AutoClicker.exe`。'
          releaseDraft: false
          prerelease: false

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-portable
          path: src-tauri/target/release/AutoClicker.exe
